name: assets_and_overrides_project
description: Fixture project exercising dependency_overrides isolation and pubspec asset scanning.
version: 1.0.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

dependency_overrides:
  http: 1.2.0
  intl: 0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/data/config.json
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
